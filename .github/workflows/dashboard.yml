name: dashboard

# The counted half of the pages is generated from the component repositories.
# This keeps it honest two ways: it refuses a pull request whose counts no
# longer match what the components contain, and it refreshes weekly so a
# component advancing does not silently age the numbers on the front page.
#
# Nothing is checked out here beyond this repository. The generator clones each
# component itself, and a component this runner cannot clone -- several are
# private -- carries its previous row forward and says so in the footnote.
# That is the honest result; the alternative is a workflow that only ever runs
# for people holding every key.

# Automatic runs are off while the Actions allowance is exhausted. Restore the
# pull_request trigger and the Monday 06:17 UTC schedule when the quota resets.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify the generated blocks match what the components contain
        if: github.event_name == 'pull_request'
        run: python tools/refresh_dashboard.py --check

      - name: Refresh and commit when the counts have moved
        if: github.event_name != 'pull_request'
        run: |
          python tools/refresh_dashboard.py
          # All three pages carry generated blocks; committing only the README
          # would push a front page that disagrees with the pages behind it.
          if git diff --quiet README.md cesm.md engine.md; then
            echo "counts unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the generated dashboard counts" README.md cesm.md engine.md
          git push
