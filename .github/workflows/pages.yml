name: pages

# Publishes the dashboard: one page per tab, the tab bar built from each page's
# own front matter. The README is the short way in and restates none of it; the
# counted blocks are written by tools/refresh_dashboard.py from the submodules,
# so the site and the repository cannot drift into two sets of numbers.
on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - _layouts/**
      - _config.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the site is a handful of markdown files, and several
      # component repositories are private -- checking them out here would fail
      # the job for nothing.
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
