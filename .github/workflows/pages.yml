name: pages

# Publishes the site: one page per tab, the tab bar built from each page's own
# front matter. The README is the short way in and restates none of it.

# Automatic runs are off while the Actions allowance is exhausted. Restore the
# push trigger on main, filtered to "*.md", _layouts/**, _config.yml, and this
# workflow, when the quota resets.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Nothing to fetch beyond this repository: the site is a handful of
      # markdown files and one layout.
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
