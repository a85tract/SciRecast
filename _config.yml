# GitHub Pages configuration.
#
# One file per tab: index.md is the architecture, engine.md the engine, cesm.md
# the first case, contribute.md how to reach us. The tab bar is built from each
# page's own front matter -- so adding a tab means adding a file rather than
# editing a list that can disagree with what exists.

# RecastEngine/ and cesm/ are not in this repository; they are excluded because a
# developer's working clones often sit there, and Jekyll would otherwise try to
# render them.
title: SciRecast
description: >-
  An agentic ecosystem for modernizing legacy scientific software. LLM agents do
  the porting; nothing ships until it has been checked against the original.

defaults:
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - RecastEngine/
  - cesm/
  - README.md
